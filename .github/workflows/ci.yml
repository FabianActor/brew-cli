name: CI

on:
  push:
    branches:
      - master
  pull_request:
  # 手动触发：当某条 run 卡在 runner 排队里（取消不掉、也重跑不了）时，
  # 用 `gh workflow run CI` 直接开一条干净的，不用为此推空提交。
  workflow_dispatch:

jobs:
  verify:
    # Windows 是本地主力平台，macOS 是真实用户的另一大平台：两边都跑，
    # 免得 Windows 专属的 platform 分支和 POSIX 分支只被一种系统验过。
    #
    # macOS 用原生 arm64 镜像（macos-latest）：GitHub-hosted 的 macOS 池子
    # 偶尔会长时间排队甚至拿不到机器（annotation: "The job was not acquired
    # by Runner of type hosted even after multiple attempts"）。试过换 Intel 镜像
    # (macos-15-intel) 绕开，同样排队超过 9 分钟，所以还是用用户真正跑的那条。
    # 遇到这个失败直接 rerun 即可：是容量问题，与代码无关。
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
